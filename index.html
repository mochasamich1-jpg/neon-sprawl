<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>NEON SPRAWL</title>
  <meta name="description" content="NEON SPRAWL - a sci-fi MUD of chrome, mana, and bad debts." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="crt">
    <div id="output"></div>

</html>
